# Dashboard de Cobrança — nginx servindo o build do Vite + proxy /api -> api_sankhya:5000
#
# O app faz TODAS as chamadas em caminho relativo ("/api/..."), igual ao proxy do
# Vite em desenvolvimento. Por isso o navegador só conversa com este nginx: mesma
# origem, sem CORS, e VITE_API_BASE continua vazio no build.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html NUNCA pode ser cacheado: ele é quem aponta para os assets com
    # hash. Se o navegador guardar uma versão antiga, o operador continua vendo o
    # app velho depois do deploy e não há como pedir F5 para todo mundo.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets versionados pelo Vite (nome com hash) — podem ser cacheados para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Encaminha as chamadas /api para o backend Flask (container api_sankhya,
    # porta 5000, alcançado pelo nome dentro da rede docker compartilhada).
    #
    # O endereço vai numa VARIÁVEL de propósito. Com o nome escrito direto no
    # proxy_pass, o nginx resolve o DNS uma única vez, ao iniciar, e guarda o IP
    # para sempre — aí todo redeploy da API (que recria o container com outro IP)
    # deixaria esta tela em 502 até alguém reiniciar o container do front. Pior:
    # se a API estivesse parada na hora do boot, o nginx nem subiria ("host not
    # found in upstream"). Com variável + resolver, o nome é resolvido a cada
    # requisição (cache de 10s) e a ordem de subida deixa de importar.
    # 127.0.0.11 é o DNS embutido do Docker, sempre disponível na rede do compose.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend http://api_sankhya:5000;
        # Sem parte de URI no destino, o caminho original (/api/...) é repassado
        # inalterado — igual ao proxy_pass literal que havia aqui.
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Anexo de chamada sobe por aqui (POST /chamadas/{id}/anexos/arquivo).
        # A API aceita 25 MB (drive.py: LIMITE_BYTES); o padrão do nginx é 1 MB,
        # o que faria qualquer anexo maior falhar com 413 antes de chegar no Flask.
        # Mantenha os dois números em sincronia.
        client_max_body_size 25m;

        # Consulta de carteira inteira e upload para o Drive são lentos;
        # 60s (padrão) estoura em dia de rede ruim.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
